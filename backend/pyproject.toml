[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "melodia-backend"
version = "0.1.0"
description = "Интеллектуальный сервис поиска музыкальных композиций Melodia"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "sqlalchemy>=2.0,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "pgvector>=0.3,<1.0",
  "alembic>=1.13,<2.0",
  "pydantic-settings>=2.3,<3.0",
  "email-validator>=2.2,<3.0",
  "pyjwt>=2.9,<3.0",
  "pwdlib[argon2]>=0.2,<1.0",
]

[project.optional-dependencies]
ml = [
  "sentence-transformers>=3.0,<6.0",
]

[tool.setuptools.packages.find]
include = ["app*"]
